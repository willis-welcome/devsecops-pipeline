# ─── SERVICE ACCOUNT ───────────────────────────────────────────
# Linked to the IRSA role so the pod gets its own AWS identity
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-service-account
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::050002895805:role/devsecops-app-pod-role

---
# ─── DEPLOYMENT ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-app
  namespace: default
  labels:
    app: devsecops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-app
  template:
    metadata:
      labels:
        app: devsecops-app
    spec:
      serviceAccountName: app-service-account

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: devsecops-app
          # Pipeline replaces :latest with the commit SHA at deploy time
          image: 050002895805.dkr.ecr.us-east-2.amazonaws.com/devsecops-app:latest
          ports:
            - containerPort: 5000

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "128Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

          # Writable scratch space, since the root filesystem is read-only
          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp

      volumes:
        - name: tmp-dir
          emptyDir: {}

---
# ─── SERVICE ───────────────────────────────────────────────────
# type LoadBalancer provisions an AWS load balancer in front of the pods
apiVersion: v1
kind: Service
metadata:
  name: devsecops-app-service
  namespace: default
spec:
  type: LoadBalancer
  selector:
    app: devsecops-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
