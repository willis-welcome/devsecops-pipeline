name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main
  # Infrastructure changes only run when manually triggered
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:

  # ─── SECRET SCAN ───────────────────────────────────────────────
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so leaked secrets in past commits are caught

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── IaC SECURITY SCAN ─────────────────────────────────────────
  iac-scan:
    runs-on: ubuntu-24.04
    needs: secret-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform

  # ─── SAST ──────────────────────────────────────────────────────
  sast-scan:
    runs-on: ubuntu-24.04
    needs: iac-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=willis-welcome_devsecops-pipeline
            -Dsonar.organization=willis-welcome
            -Dsonar.sources=app
            -Dsonar.python.version=3.11

  # ─── DAST ──────────────────────────────────────────────────────
  dast-scan:
    runs-on: ubuntu-24.04
    needs: sast-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Start application
        run: docker compose up -d --build

      - name: Wait for app to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5000/health > /dev/null; then
              echo "Application is ready"
              break
            fi
            sleep 2
          done

      # Run ZAP as a container directly to avoid the action's artifact naming bug
      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --network host \
            -v ${{ github.workspace }}:/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://localhost:5000 \
            -r zap-report.html \
            -I
        continue-on-error: true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: zap-report
          path: zap-report.html

  # ─── SBOM + CVE SCAN ───────────────────────────────────────────
  sbom-scan:
    runs-on: ubuntu-24.04
    needs: dast-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build image
        run: docker build -t devsecops-app:scan ./app

      - name: Install Syft and Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      # SPDX is the SBOM format expected in federal environments
      - name: Generate SBOM
        run: syft devsecops-app:scan -o spdx-json > sbom.json

      # Fail on fixable critical CVEs; unfixable ones stay recorded in the SBOM
      - name: Scan SBOM for CVEs
        run: grype sbom:./sbom.json --fail-on critical --only-fixed

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sbom-report
          path: sbom.json

  # ─── TERRAFORM PROVISION (manual only) ─────────────────────────
  # Runs before build-push because Terraform creates the ECR repository
  terraform-provision:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: sbom-scan
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

  # ─── BUILD AND PUSH TO ECR (manual only) ───────────────────────
  build-push:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: terraform-provision
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Commit SHA tag makes every image traceable to the exact code that built it
      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: devsecops-app
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Verify image in ECR
        run: |
          aws ecr describe-images \
            --repository-name devsecops-app \
            --image-ids imageTag=${{ github.sha }}

  # ─── KUBERNETES DEPLOY (manual only) ───────────────────────────
  # EKS API endpoint is private: this job requires a runner with VPC access
  k8s-deploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: build-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --name devsecops-cluster

      # Deploy the exact image built from this commit
      - name: Set image tag
        run: sed -i "s|:latest|:${{ github.sha }}|g" k8s/deployment.yaml

      - name: Deploy
        run: kubectl apply -f k8s/deployment.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/devsecops-app --timeout=300s

      - name: Show service
        run: kubectl get service devsecops-app-service

  # ─── MONITORING (manual only) ──────────────────────────────────
  monitoring:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: k8s-deploy
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Configure kubectl for EKS
        run: aws eks update-kubeconfig --name devsecops-cluster

      - name: Install Prometheus and Grafana
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            --wait

      - name: Verify monitoring pods
        run: kubectl get pods -n monitoring