name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - main

jobs:

  # ─── STAGE 1 — CHECKOV IaC SECURITY SCAN ──────────────────────
  checkov-scan:
    runs-on: ubuntu-latest
    steps:
      # Downloads your code onto the GitHub Actions runner machine
      - name: Checkout code
        uses: actions/checkout@v4

      # Scans all Terraform files for security misconfigurations
      # If any check fails the pipeline stops here
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform
          framework: terraform

  # ─── STAGE 2 — SONARCLOUD SAST ─────────────────────────────────
  sonarcloud-scan:
    runs-on: ubuntu-latest
    # This stage only starts after Stage 1 passes
    # needs: means this job depends on another job finishing successfully
    needs: checkov-scan
    steps:
      # Downloads your code onto a fresh runner machine for this stage
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 means download the full git history
          # SonarCloud needs this to do accurate code analysis
          # Without it SonarCloud only sees the latest commit
          fetch-depth: 0

      # Runs SonarCloud analysis against your source code
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          # GITHUB_TOKEN is automatically provided by GitHub Actions
          # SonarCloud uses it to post scan results back to your pull requests
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SONAR_TOKEN is the secret we added to GitHub
          # This authenticates us to SonarCloud
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=willis-welcome_devsecops-pipeline
            -Dsonar.organization=willis-welcome
            -Dsonar.sources=app
            -Dsonar.python.version=3.11